bio: |
  I am a doctoral candidate at the University of Mannheim and a researcher at
  the Mannheim Institute for Sustainable Energy Studies (MISES). I combine
  techno-economic analysis with carbon accounting to study the economics of
  decarbonization technologies, emission allocation effects and the investment
  incentives it shapes. I have held visiting positions at the Stanford
  Graduate School of Business and the Toulouse School of Management. My
  research has been published in Energy & Environmental Science and Nature
  Communications.

